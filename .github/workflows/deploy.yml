- name: Deploy to Oracle VM via Native SSH
        run: |
          # 1. Set up the SSH directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # 2. Safely write the multiline private key using a Heredoc
          cat << 'EOF_SSH_KEY' > ~/.ssh/id_rsa
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF_SSH_KEY
          
          # Fix permissions and strip any accidental Windows returns
          chmod 600 ~/.ssh/id_rsa
          sed -i 's/\r$//' ~/.ssh/id_rsa
          
          # 3. Add the Oracle server to known hosts
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts
          
          # 4. Connect (Hardcoding 'ubuntu' to guarantee correct user)
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.HOST }} << 'EOF'
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ubuntu
            fi
            
            # Open Ubuntu's internal firewall for Port 80
            sudo iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT || true
            sudo netfilter-persistent save || true
            
            # Pull and run the latest Docker image
            sudo docker pull ghcr.io/chinkhuselts/cyber-threat-map:latest
            sudo docker stop threat-map || true
            sudo docker rm threat-map || true
            sudo docker run -d --name threat-map -p 80:3000 ghcr.io/chinkhuselts/cyber-threat-map:latest
            
            # Cleanup old unused images
            sudo docker image prune -f
          EOF
