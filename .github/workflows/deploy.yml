name: CI/CD to Oracle Cloud

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chinkhuselts/cyber-threat-map

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Oracle VM
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.HOST }} << 'EOF'
            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ubuntu
            fi
            
            # Open Ubuntu's internal firewall for Port 80
            sudo iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT || true
            sudo netfilter-persistent save || true
            
            # Pull and run the latest Docker image
            sudo docker pull ghcr.io/chinkhuselts/cyber-threat-map:latest
            
            # Stop and remove the old container if it exists
            sudo docker stop threat-map || true
            sudo docker rm threat-map || true
            
            # Run the new container on port 80
            sudo docker run -d --name threat-map -p 80:3000 ghcr.io/chinkhuselts/cyber-threat-map:latest
            
            # Cleanup old unused images
            sudo docker image prune -f
          EOF
